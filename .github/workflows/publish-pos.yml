name: Publish POS release
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Public Drive link after uploading the signed APK to Carrot Tickets
        required: true
        type: string
      release_json:
        description: Paste the release.json from the signed POS build artifact
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-pos-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare canonical release record
        env:
          APK_URL: ${{ inputs.apk_url }}
          RELEASE_JSON: ${{ inputs.release_json }}
        run: node scripts/publish-pos-release.mjs
      - run: npm ci
      - run: node --test scripts/publish-pos-release.test.mjs
      - run: npm test
      - run: npm run build
      - name: Publish download link and update record
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pos-release.json
          git commit -m 'release: publish signed POS update'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for the production dashboard deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CONTRACTS_CLOUDFLARE_API_TOKEN }}
          PUBLISHED_COMMIT: ${{ steps.commit.outputs.sha }}
        run: node scripts/wait-pos-deployment.mjs
  notify:
    if: always()
    needs: publish
    uses: omegathesecond/carrot-tickets-pos/.github/workflows/notify.yml@main
    with:
      result: ${{ needs.publish.result }}
      stage: dashboard link and POS update publication
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      recipient: ${{ vars.POS_RELEASE_NOTIFY_TO }}
    secrets:
      YEBOLINK_API_KEY: ${{ secrets.YEBOLINK_API_KEY }}
